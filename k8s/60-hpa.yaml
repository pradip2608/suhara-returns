# Optional. Needs metrics-server:
#   minikube addons enable metrics-server
#   kind: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#         (then add --kubelet-insecure-tls to its args)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: suhara-returns
  namespace: suhara
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: suhara-returns
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
