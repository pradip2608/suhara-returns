# Requires the NGINX ingress controller.
#   kind:     kubectl apply -f https://kind.sigs.k8s.io/examples/ingress/deploy-ingress-nginx.yaml
#   minikube: minikube addons enable ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: suhara-returns
  namespace: suhara
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m" # 4 photos x 5MB + form fields
spec:
  ingressClassName: nginx
  rules:
    - host: returns.localtest.me # resolves to 127.0.0.1, no /etc/hosts edits needed
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: suhara-returns
                port:
                  name: http
